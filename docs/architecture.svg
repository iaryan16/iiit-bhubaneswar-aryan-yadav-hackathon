<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="600" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    S&amp;P GLOBAL &amp; CRISIL HACKATHON 2026 — MODULE B ARCHITECTURE
  </text>
  <text x="600" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Real-Time Event-Driven Financial Stress Testing Platform (Spring Boot 3 + React/Vite/TS + Python FastAPI)
  </text>

  <!-- Section 1: Ingestion Layer -->
  <rect x="40" y="110" width="240" height="540" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5" />
  <rect x="55" y="125" width="210" height="32" rx="6" fill="#1e3a8a" />
  <text x="160" y="146" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">1. MULTI-SOURCE INGESTION</text>

  <!-- GDELT Box -->
  <rect x="60" y="180" width="200" height="75" rx="8" fill="#0f172a" stroke="#475569" />
  <text x="160" y="205" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">GDELT DOC 2.0 API</text>
  <text x="160" y="225" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Global news events &amp; GKG</text>
  <text x="160" y="240" font-family="'Segoe UI', sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle">@Scheduled (every 15 min)</text>

  <!-- NewsAPI Box -->
  <rect x="60" y="275" width="200" height="75" rx="8" fill="#0f172a" stroke="#475569" />
  <text x="160" y="300" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">NewsAPI Ingestor</text>
  <text x="160" y="320" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Live financial headlines</text>
  <text x="160" y="335" font-family="'Segoe UI', sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle">API key + JSON fallback</text>

  <!-- CSV Replay Box -->
  <rect x="60" y="370" width="200" height="75" rx="8" fill="#0f172a" stroke="#475569" />
  <text x="160" y="395" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">CSV Offline Replay</text>
  <text x="160" y="415" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Curated financial tweets</text>
  <text x="160" y="430" font-family="'Segoe UI', sans-serif" font-size="9" fill="#10b981" text-anchor="middle">Deterministic offline demo</text>

  <!-- Pre-processing Box -->
  <rect x="60" y="465" width="200" height="160" rx="8" fill="#090d16" stroke="#3b82f6" stroke-dasharray="4 4" />
  <text x="160" y="490" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Sanitization &amp; Dedup</text>
  <text x="75" y="520" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• SHA-256 Headline Hash</text>
  <text x="75" y="545" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Whitespace Normalization</text>
  <text x="75" y="570" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• English Quality Filter</text>
  <text x="75" y="595" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Memory Hash Dedup Cache</text>

  <!-- Section 2: NLP Sidecar & Java Fallback -->
  <rect x="320" y="110" width="260" height="540" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5" />
  <rect x="335" y="125" width="230" height="32" rx="6" fill="#4c1d95" />
  <text x="450" y="146" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c4b5fd" text-anchor="middle">2. NLP INTELLIGENCE ENGINE</text>

  <!-- FastAPI Sidecar Box -->
  <rect x="340" y="180" width="220" height="150" rx="8" fill="#0f172a" stroke="#8b5cf6" />
  <text x="450" y="205" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">Python FastAPI Sidecar (:8000)</text>
  <text x="355" y="230" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• FinBERT Sentiment P(pos)-P(neg)</text>
  <text x="355" y="250" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• BART Zero-Shot + Rule Hybrid</text>
  <text x="355" y="270" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• spaCy Named Entity Recognition</text>
  <text x="355" y="290" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• POST /analyze &amp; /batch</text>
  <text x="355" y="310" font-family="'Segoe UI', sans-serif" font-size="9" fill="#10b981">✓ 95.0% Benchmark Accuracy</text>

  <!-- Java Fallback Box -->
  <rect x="340" y="350" width="220" height="120" rx="8" fill="#0f172a" stroke="#f59e0b" />
  <text x="450" y="375" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fcd34d" text-anchor="middle">Java FallbackAnalyzer</text>
  <text x="355" y="398" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• Embedded Financial Lexicon</text>
  <text x="355" y="418" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• Rule-based Taxonomy Classifier</text>
  <text x="355" y="438" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• Zero-network standalone operation</text>
  <text x="355" y="458" font-family="'Segoe UI', sans-serif" font-size="9" fill="#10b981">✓ 100.0% Benchmark Accuracy</text>

  <!-- Impact Scorer Box -->
  <rect x="340" y="490" width="220" height="135" rx="8" fill="#090d16" stroke="#f43f5e" />
  <text x="450" y="515" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">Transparent ImpactScorer</text>
  <text x="355" y="538" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">impact = clamp(base + 2·|sent| +</text>
  <text x="355" y="555" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">  kwBonus + velocity + entity, 1..10)</text>
  <text x="355" y="580" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fda4af">• EntityMapper (entity_map.csv)</text>
  <text x="355" y="605" font-family="'Segoe UI', sans-serif" font-size="9" fill="#38bdf8">• Persists Rationale Array</text>

  <!-- Section 3: Stress Testing Engine -->
  <rect x="620" y="110" width="280" height="540" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5" />
  <rect x="635" y="125" width="250" height="32" rx="6" fill="#831843" />
  <text x="760" y="146" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fbcfe8" text-anchor="middle">3. FINANCIAL STRESS ENGINE</text>

  <!-- Trigger Service Box -->
  <rect x="640" y="180" width="240" height="95" rx="8" fill="#0f172a" stroke="#ec4899" />
  <text x="760" y="205" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">TriggerService</text>
  <text x="655" y="228" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• Threshold: Impact ≥ 7, Conf &gt; 0.5</text>
  <text x="655" y="248" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• 30-Min Event Debouncing Engine</text>
  <text x="655" y="265" font-family="'Segoe UI', sans-serif" font-size="9" fill="#38bdf8">Supresses noise, retains peak impact</text>

  <!-- Synthetic Portfolio Box -->
  <rect x="640" y="290" width="240" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" />
  <text x="760" y="312" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle">Synthetic Portfolio ($1.76B)</text>
  <text x="655" y="333" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• 200 Positions across 4 Asset Classes</text>
  <text x="655" y="350" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• Bonds, Loans, Swaps/FX, Equities</text>
  <text x="655" y="367" font-family="'Segoe UI', sans-serif" font-size="9" fill="#10b981">Deterministic Seed: 42</text>

  <!-- Revaluators Box -->
  <rect x="640" y="390" width="240" height="235" rx="8" fill="#090d16" stroke="#f43f5e" />
  <text x="760" y="415" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">Multi-Asset Revaluation Models</text>
  <text x="655" y="438" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Bonds:</text>
  <text x="655" y="455" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">ΔP/P = -D·Δy + 1/2·C·Δy² - D·Δspread</text>
  <text x="655" y="475" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Loans:</text>
  <text x="655" y="492" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">ΔMTM + PD·LGD·EAD (Migration ≥ 8)</text>
  <text x="655" y="512" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Derivatives:</text>
  <text x="655" y="529" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Swaps (DV01·Δrate) &amp; FX (Notional·Δfx·δ)</text>
  <text x="655" y="549" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Equities:</text>
  <text x="655" y="566" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">V·shock·beta (Sector overrides applied)</text>
  <text x="655" y="595" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f43f5e">Severity: baseShock × min(impact/8, 1.5)</text>

  <!-- Section 4: React Dashboard -->
  <rect x="940" y="110" width="220" height="540" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5" />
  <rect x="955" y="125" width="190" height="32" rx="6" fill="#065f46" />
  <text x="1050" y="146" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">4. REACT DASHBOARD</text>

  <!-- UI Components List -->
  <rect x="950" y="180" width="200" height="90" rx="8" fill="#0f172a" stroke="#10b981" />
  <text x="1050" y="202" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Header KPIs</text>
  <text x="965" y="222" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Active Portfolio Valuation</text>
  <text x="965" y="240" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Stress Delta Loss %</text>
  <text x="965" y="258" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Baseline vs Stressed EL</text>

  <rect x="950" y="285" width="200" height="95" rx="8" fill="#0f172a" stroke="#0ea5e9" />
  <text x="1050" y="307" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">SSE Live Signal Feed</text>
  <text x="965" y="327" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Real-time table streaming</text>
  <text x="965" y="345" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Impact badges (1..10)</text>
  <text x="965" y="363" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• FinBERT sentiment &amp; search</text>

  <rect x="950" y="395" width="200" height="105" rx="8" fill="#0f172a" stroke="#f43f5e" />
  <text x="1050" y="417" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">Stress Panel</text>
  <text x="965" y="437" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Before vs After Recharts</text>
  <text x="965" y="455" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Asset/Sector/Region tabs</text>
  <text x="965" y="473" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Top-10 Loss Positions</text>
  <text x="965" y="491" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• "Why?" Rationale Drawer</text>

  <rect x="950" y="515" width="200" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" />
  <text x="1050" y="537" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Interactive Controls</text>
  <text x="965" y="557" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Dynamic Threshold Slider</text>
  <text x="965" y="575" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Replay Stream Button</text>
  <text x="965" y="593" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Manual Scenario Injector</text>
  <text x="965" y="611" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Historical Valuation Path</text>

  <!-- Connectors -->
  <line x1="280" y1="380" x2="320" y2="380" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="320,380 312,376 312,384" fill="#3b82f6" />

  <line x1="580" y1="380" x2="620" y2="380" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="620,380 612,376 612,384" fill="#a855f7" />

  <line x1="900" y1="380" x2="940" y2="380" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="940,380 932,376 932,384" fill="#10b981" />
</svg>
