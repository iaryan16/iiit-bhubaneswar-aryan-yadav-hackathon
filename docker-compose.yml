services:
  nlp-service:
    build:
      context: src/nlp-service
      dockerfile: Dockerfile
    container_name: risk-nlp-sidecar
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    container_name: risk-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    environment:
      - SERVER_PORT=8080
      - NLP_SERVICE_URL=http://nlp-service:8000
      - NLP_SERVICE_TIMEOUT_MS=3000
      - STRESS_IMPACT_THRESHOLD=7
      - STRESS_CONFIDENCE_THRESHOLD=0.5
      - STRESS_DEBOUNCE_MINUTES=30
    depends_on:
      nlp-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    container_name: risk-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: risk-network
